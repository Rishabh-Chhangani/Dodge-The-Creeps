name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Engine & Export Templates
        run: |
          curl -L -s https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          curl -L -s https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz -o templates.tpz
          unzip -q templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.5.stable/

      - name: Export Windows 64-bit Executable
        run: |
          mkdir -p export/windows
          godot --headless --path . --export-release "Windows Desktop" export/windows/DodgeTheCreeps.exe

      - name: Package Windows Artifact
        run: |
          cd export/windows
          zip -q -r ../../DodgeTheCreeps-Windows-x86_64.zip .
          cd ../..

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DodgeTheCreeps-Windows-x86_64
          path: DodgeTheCreeps-Windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DodgeTheCreeps-Windows-x86_64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DodgeTheCreeps-Windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
